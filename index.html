<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cielaki">
<meta name="theme-color" content="#2f5d2a">
<title>Cielaki – igloo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#e9efe3;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
header{position:fixed;left:0;right:0;top:0;z-index:5;background:#2f5d2a;color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
header h1{font-size:18px;margin:0;flex:0 0 auto}
#total{flex:1;font-size:15px;opacity:.95;text-align:right}
#dot{width:16px;height:16px;border-radius:50%;background:#999;border:2px solid #fff;flex:0 0 auto}
#dot.ok{background:#3ecf5a}#dot.busy{background:#f5a623}#dot.err{background:#e5383b}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background-color:#e9efe3;
  background-image:linear-gradient(#00000012 1px,transparent 1px),linear-gradient(90deg,#00000012 1px,transparent 1px)}
#field{position:absolute;left:0;top:0;transform-origin:0 0}
.h{position:absolute;width:0;height:0}
.box{position:absolute;left:0;top:0;border-radius:16px;background:#fff;border:3px solid #b5c1aa;box-shadow:0 2px 5px #0003;overflow:hidden}
.box::before{content:"";position:absolute;left:14%;right:14%;bottom:0;height:17%;background:#3a4738;border-radius:12px 12px 0 0}
.box::after{content:"";position:absolute;inset:0;background:#2e7dd266;transform:scaleY(0);transform-origin:bottom}
.box.holding::after{transform:scaleY(1);transition:transform 3s linear}
.h.sel .box{border-color:#2e7dd2;box-shadow:0 0 0 5px #2e7dd255}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap}
.lbl b{font-size:22px;font-weight:800;color:#14361a;background:#ffffffe0;padding:1px 6px;border-radius:8px}
.lbl small{display:block;font-size:12px;color:#333;margin-top:2px;background:#ffffffb0;border-radius:6px;padding:0 4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:#fffffff0;box-shadow:0 -1px 6px #0002}
nav button{flex:1;border:0;background:#eef2ea;border-radius:12px;padding:8px 2px;font-size:22px;line-height:1.1;color:#1d2b1b}
nav button span{display:block;font-size:11px;margin-top:2px}
nav button.on{background:#2f5d2a;color:#fff}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;margin:10px 0 4px;color:#444}
input{width:100%;font-size:20px;padding:10px;border:2px solid #ccd;border-radius:10px;-webkit-user-select:text;user-select:text}
#eL{font-size:34px;text-align:center;font-weight:800}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.btn{flex:1;font-size:18px;padding:12px 6px;border:0;border-radius:12px;background:#eef2ea}
.btn.pri{background:#2f5d2a;color:#fff}.btn.red{background:#fde2e2;color:#a00}
.presets button{font-size:17px;padding:10px 2px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222d;color:#fff;padding:10px 16px;border-radius:20px;
  font-size:15px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.hint{font-size:13px;color:#666;line-height:1.4}
</style>
</head>
<body>
<div id="stage"><div id="field"></div></div>

<header>
  <h1>🐮 Cielaki</h1>
  <div id="total"></div>
  <div id="dot" title="Synchronizacja"></div>
</header>

<nav>
  <button id="bAdd">➕<span>Dodaj</span></button>
  <button id="bRot">↻<span>Obróć</span></button>
  <button id="bRow">▤<span>Rząd</span></button>
  <button id="bFit">⤢<span>Pokaż</span></button>
  <button id="bLock">🔓<span>Blokada</span></button>
  <button id="bCfg">⚙️<span>GitHub</span></button>
</nav>

<dialog id="dEdit">
  <h2>Budka</h2>
  <label>Mleko (litry)</label>
  <div class="row" style="margin-top:0">
    <button id="eMinus" class="btn">−0.5</button>
    <input id="eL" inputmode="decimal" style="flex:2">
    <button id="ePlus" class="btn">+0.5</button>
  </div>
  <div class="row presets">
    <button>2</button><button>2.5</button><button>3</button><button>3.5</button><button>4</button><button>5</button><button>6</button>
  </div>
  <label>Nazwa / nr kolczyka (opcjonalnie)</label>
  <input id="eN" placeholder="np. 1234 Mućka">
  <label>Obrót</label>
  <div class="row" style="margin-top:0">
    <button id="eR1" class="btn">↺ 15°</button>
    <button id="eR2" class="btn">↻ 90°</button>
    <button id="eR3" class="btn">↻ 15°</button>
  </div>
  <div class="row">
    <button id="eDel" class="btn red">🗑 Usuń</button>
    <button id="eOk" class="btn pri">Zapisz</button>
  </div>
</dialog>

<dialog id="dCfg">
  <h2>Synchronizacja GitHub</h2>
  <p class="hint">Dane zapisują się w pliku w Twoim repozytorium. Wpisz to samo na obu telefonach.</p>
  <label>Właściciel (login GitHub)</label><input id="cO" autocapitalize="off" autocorrect="off">
  <label>Repozytorium</label><input id="cR" autocapitalize="off" autocorrect="off" placeholder="cielaki">
  <label>Gałąź</label><input id="cB" autocapitalize="off" value="main">
  <label>Plik z danymi</label><input id="cP" autocapitalize="off" value="data.json">
  <label>Token (github_pat_…)</label><input id="cT" type="password" autocapitalize="off" autocorrect="off">
  <div class="row">
    <button id="cOff" class="btn red">Rozłącz</button>
    <button id="cOk" class="btn pri">Połącz</button>
  </div>
  <div class="row"><button id="cX" class="btn">Zamknij</button></div>
</dialog>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const W = 70, H = 110, GRID = 10, GAP = 12, HOLD_MS = 3000, POLL_MS = 10000;
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let state = load('ck_state') || { v:1, hutches:{}, deleted:{} };
let cfg = load('ck_cfg');
let sha = load('ck_sha');
let view = load('ck_view') || { x:40, y:90, s:1 };
let locked = load('ck_lock') === true;
let selected = null, dirty = load('ck_dirty') === true;
const stage = $('#stage'), field = $('#field');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtL = l => (Math.round(l * 100) / 100).toString();
const snap = v => Math.round(v / GRID) * GRID;
const now = () => Date.now();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- rysowanie ---------- */
function applyView(){
  field.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  const g = GRID * 5 * view.s;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  store('ck_view', view);
}
function hutchHTML(h){
  return `<div class="h${h.id===selected?' sel':''}" data-h="${h.id}" style="left:${h.x}px;top:${h.y}px">
    <div class="box" data-id="${h.id}" style="width:${W}px;height:${H}px;transform:translate(-50%,-50%) rotate(${h.rot||0}deg)"></div>
    <div class="lbl"><b>${fmtL(h.l)} l</b>${h.name?`<small>${esc(h.name)}</small>`:''}</div></div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  const list = Object.values(state.hutches);
  field.innerHTML = list.map(hutchHTML).join('');
  const sum = list.reduce((a,h)=>a+(+h.l||0),0);
  $('#total').textContent = `Razem: ${fmtL(sum)} l · ${list.length} budek`;
  $('#bLock').classList.toggle('on', locked);
  $('#bLock').firstChild.textContent = locked ? '🔒' : '🔓';
  applyView();
}
function moveEl(h){ const el = field.querySelector(`[data-h="${h.id}"]`); if(el){ el.style.left=h.x+'px'; el.style.top=h.y+'px'; } }

function changed(){
  store('ck_state', state);
  dirty = true; store('ck_dirty', true);
  render();
  clearTimeout(changed.t); changed.t = setTimeout(push, 1200);
}

/* ---------- dotyk: przesuwanie, przytrzymanie, przybliżanie ---------- */
const ptrs = new Map(); let act = null;
const boxEl = id => field.querySelector(`.box[data-id="${id}"]`);
function cancelHold(){ if(act && act.type==='hutch'){ clearTimeout(act.timer); const b=boxEl(act.id); b && b.classList.remove('holding'); } }
function startPinch(){
  const [a,b] = [...ptrs.values()];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  act = { type:'pinch', d0:Math.hypot(a.x-b.x,a.y-b.y)||1, s0:view.s, wx:(mx-view.x)/view.s, wy:(my-view.y)/view.s };
}
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2){
    if(act && act.type==='hutch'){ cancelHold(); if(act.moved) finishDrag(); }
    startPinch(); return;
  }
  if(ptrs.size > 2) return;
  const box = e.target.closest('.box');
  if(box && state.hutches[box.dataset.id]){
    const h = state.hutches[box.dataset.id];
    act = { type:'hutch', id:h.id, sx:e.clientX, sy:e.clientY, hx:h.x, hy:h.y, moved:false, held:false };
    box.classList.add('holding');
    act.timer = setTimeout(() => {
      if(!act || act.id!==h.id) return;
      act.held = true; box.classList.remove('holding');
      navigator.vibrate && navigator.vibrate(80);
      openEdit(h.id);
    }, HOLD_MS);
  } else {
    act = { type:'pan', sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:false };
  }
});
stage.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(!act) return;
  if(act.type === 'pinch' && ptrs.size >= 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    view.s = Math.min(4, Math.max(0.2, act.s0 * d / act.d0));
    view.x = mx - act.wx*view.s; view.y = my - act.wy*view.s;
    applyView(); return;
  }
  const dx = e.clientX-act.sx, dy = e.clientY-act.sy;
  if(!act.moved && Math.hypot(dx,dy) > 8){
    act.moved = true;
    if(act.type==='hutch'){ cancelHold(); if(locked) toast('Blokada włączona – odblokuj 🔓, żeby przesuwać'); }
  }
  if(!act.moved) return;
  if(act.type==='hutch' && !locked && !act.held){
    const h = state.hutches[act.id]; if(!h) return;
    h.x = act.hx + dx/view.s; h.y = act.hy + dy/view.s; moveEl(h);
  } else if(act.type==='pan'){
    view.x = act.vx + dx; view.y = act.vy + dy; applyView();
  }
});
function finishDrag(){
  const h = state.hutches[act.id];
  if(h && !locked){ h.x = snap(h.x); h.y = snap(h.y); h.t = now(); changed(); }
}
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(!act) return;
  if(act.type==='pinch'){ if(ptrs.size<2) act=null; return; }
  if(act.type==='hutch'){
    cancelHold();
    if(!act.moved && !act.held){ selected = act.id; render(); }
    else if(act.moved && !act.held) finishDrag();
  } else if(act.type==='pan' && !act.moved && selected){ selected=null; render(); }
  act = null;
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const wx=(e.clientX-view.x)/view.s, wy=(e.clientY-view.y)/view.s;
  view.s = Math.min(4, Math.max(0.2, view.s * (e.deltaY<0?1.1:0.9)));
  view.x = e.clientX-wx*view.s; view.y = e.clientY-wy*view.s; applyView();
}, {passive:false});

/* ---------- przyciski ---------- */
const rad = d => d*Math.PI/180;
$('#bAdd').onclick = () => {
  const s = state.hutches[selected];
  let h;
  if(s){
    const r = rad(s.rot||0);
    h = { id:uid(), x:snap(s.x+Math.cos(r)*(W+GAP)), y:snap(s.y+Math.sin(r)*(W+GAP)), rot:s.rot||0, l:s.l, name:'', t:now() };
  } else {
    h = { id:uid(), x:snap((innerWidth/2-view.x)/view.s), y:snap((innerHeight/2-view.y)/view.s), rot:0, l:3, name:'', t:now() };
  }
  state.hutches[h.id] = h; selected = h.id; changed();
  toast('Dodano. Przytrzymaj 3 s, żeby wpisać litry');
};
$('#bRot').onclick = () => {
  const h = state.hutches[selected]; if(!h) return toast('Najpierw dotknij budkę');
  h.rot = ((h.rot||0) + 90) % 360; h.t = now(); changed();
};
$('#bRow').onclick = () => {
  const s = state.hutches[selected]; if(!s) return toast('Dotknij budkę, do której wyrównać rząd');
  const r = rad(s.rot||0), d = [Math.cos(r), Math.sin(r)], n = [-Math.sin(r), Math.cos(r)];
  const row = Object.values(state.hutches).map(h => {
    const vx=h.x-s.x, vy=h.y-s.y; return { h, p:vx*d[0]+vy*d[1], q:vx*n[0]+vy*n[1] };
  }).filter(o => Math.abs(o.q) < H*0.6).sort((a,b)=>a.p-b.p);
  const p0 = Math.min(...row.map(o=>o.p));
  const t = now();
  row.forEach((o,i) => {
    const p = p0 + i*(W+GAP);
    o.h.x = snap(s.x + d[0]*p); o.h.y = snap(s.y + d[1]*p); o.h.rot = s.rot||0; o.h.t = t;
  });
  changed(); toast(`Wyrównano ${row.length} budek w rząd`);
};
function fit(){
  const list = Object.values(state.hutches);
  if(!list.length){ view={x:40,y:90,s:1}; applyView(); return; }
  const xs=list.map(h=>h.x), ys=list.map(h=>h.y), m=H/2+10;
  const x0=Math.min(...xs)-m, x1=Math.max(...xs)+m, y0=Math.min(...ys)-m, y1=Math.max(...ys)+m;
  const top=70, bot=90, aw=innerWidth-20, ah=innerHeight-top-bot;
  view.s = Math.min(2.5, Math.max(0.2, Math.min(aw/(x1-x0), ah/(y1-y0))));
  view.x = 10 + (aw-(x1-x0)*view.s)/2 - x0*view.s;
  view.y = top + (ah-(y1-y0)*view.s)/2 - y0*view.s;
  applyView();
}
$('#bFit').onclick = fit;
$('#bLock').onclick = () => { locked=!locked; store('ck_lock',locked); render(); toast(locked?'Zablokowano przesuwanie':'Można przesuwać'); };

/* ---------- edycja ---------- */
let editId = null;
const dEdit = $('#dEdit');
function openEdit(id){
  const h = state.hutches[id]; if(!h) return;
  editId = id; selected = id; render();
  $('#eL').value = fmtL(h.l); $('#eN').value = h.name||'';
  dEdit.showModal();
}
const parseL = () => { const v = parseFloat(String($('#eL').value).replace(',','.')); return isNaN(v)?0:Math.max(0,v); };
$('#eMinus').onclick = () => $('#eL').value = fmtL(Math.max(0, parseL()-0.5));
$('#ePlus').onclick  = () => $('#eL').value = fmtL(parseL()+0.5);
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => $('#eL').value = b.textContent);
function rotEdit(deg){ const h=state.hutches[editId]; if(!h) return; h.rot=(((h.rot||0)+deg)%360+360)%360; h.t=now(); changed(); }
$('#eR1').onclick = () => rotEdit(-15);
$('#eR2').onclick = () => rotEdit(90);
$('#eR3').onclick = () => rotEdit(15);
$('#eOk').onclick = () => {
  const h = state.hutches[editId];
  if(h){ h.l = parseL(); h.name = $('#eN').value.trim(); h.t = now(); changed(); }
  dEdit.close();
};
$('#eDel').onclick = () => {
  if(!confirm('Usunąć tę budkę?')) return;
  delete state.hutches[editId]; state.deleted[editId] = now(); selected = null; changed(); dEdit.close();
};

/* ---------- GitHub ---------- */
const dot = $('#dot');
function setDot(c, title){ dot.className = c; dot.title = title||''; }
function b64enc(str){ const b=new TextEncoder().encode(str); let s=''; for(const x of b) s+=String.fromCharCode(x); return btoa(s); }
function b64dec(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c=>c.charCodeAt(0))); }
function api(path){ return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`; }
function hdr(){ return { 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json' }; }
async function errMsg(r){
  if(r.status===401) return 'Zły lub wygasły token';
  if(r.status===403) return 'Token nie ma uprawnień do zapisu (Contents: Read and write)';
  if(r.status===404) return 'Nie znaleziono repozytorium/gałęzi';
  let m=''; try{ m=(await r.json()).message; }catch(_){}
  return 'Błąd GitHub '+r.status+' '+m;
}
async function getRemote(){
  const r = await fetch(api()+'?ref='+encodeURIComponent(cfg.branch)+'&_='+now(), { headers:hdr(), cache:'no-store' });
  if(r.status===404){
    const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, { headers:hdr(), cache:'no-store' });
    if(!rr.ok) throw new Error(await errMsg(rr));
    return null; // repo jest, pliku jeszcze nie ma
  }
  if(!r.ok) throw new Error(await errMsg(r));
  const j = await r.json();
  return { sha:j.sha, data:JSON.parse(b64dec(j.content)) };
}
function merge(a, b){
  const out = { v:1, hutches:{}, deleted:{ ...(a.deleted||{}) } };
  for(const [id,t] of Object.entries(b.deleted||{})) out.deleted[id] = Math.max(out.deleted[id]||0, t);
  const ids = new Set([...Object.keys(a.hutches||{}), ...Object.keys(b.hutches||{})]);
  for(const id of ids){
    const x=(a.hutches||{})[id], y=(b.hutches||{})[id];
    const h = !x ? y : !y ? x : ((y.t||0) > (x.t||0) ? y : x);
    if(h && !(out.deleted[id] >= (h.t||0))) out.hutches[id] = h;
  }
  return out;
}
let pushing=false, again=false;
async function push(){
  if(!cfg || !dirty) return;
  if(pushing){ again=true; return; }
  pushing=true; setDot('busy','Zapisywanie…');
  try{
    for(let attempt=0; attempt<3; attempt++){
      const rem = await getRemote();
      if(rem){ state = merge(state, rem.data); sha = rem.sha; } else sha = null;
      const body = { message:'Aktualizacja budek', content:b64enc(JSON.stringify(state,null,1)), branch:cfg.branch };
      if(sha) body.sha = sha;
      const r = await fetch(api(), { method:'PUT', headers:{...hdr(),'Content-Type':'application/json'}, body:JSON.stringify(body) });
      if(r.status===409 || r.status===422) continue; // ktoś zapisał w międzyczasie – ponów
      if(!r.ok) throw new Error(await errMsg(r));
      sha = (await r.json()).content.sha;
      dirty = false; store('ck_dirty',false); store('ck_sha',sha); store('ck_state',state);
      setDot('ok','Zsynchronizowano ' + new Date().toLocaleTimeString());
      if(!act && !dEdit.open) render();
      break;
    }
  } catch(e){ setDot('err', e.message); toast('⚠️ '+e.message); }
  pushing=false;
  if(again){ again=false; push(); }
}
async function pull(force){
  if(!cfg || pushing || act || dEdit.open) return;
  if(dirty){ push(); return; }
  try{
    const rem = await getRemote();
    if(rem && (rem.sha!==sha || force)){
      state = merge(state, rem.data); sha = rem.sha;
      store('ck_state',state); store('ck_sha',sha); render();
    }
    setDot('ok','Zsynchronizowano ' + new Date().toLocaleTimeString());
  } catch(e){ setDot('err', e.message); if(force) toast('⚠️ '+e.message); }
}
setInterval(() => pull(false), POLL_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) pull(true); });
dot.onclick = () => { if(!cfg) return openCfg(); toast(dot.title || 'Synchronizuję…'); dirty ? push() : pull(true); };

const dCfg = $('#dCfg');
function openCfg(){
  const c = cfg || {};
  $('#cO').value=c.owner||''; $('#cR').value=c.repo||''; $('#cB').value=c.branch||'main';
  $('#cP').value=c.path||'data.json'; $('#cT').value=c.token||'';
  dCfg.showModal();
}
$('#bCfg').onclick = openCfg;
$('#cX').onclick = () => dCfg.close();
$('#cOff').onclick = () => { cfg=null; localStorage.removeItem('ck_cfg'); setDot('','Brak synchronizacji'); dCfg.close(); toast('Rozłączono – dane tylko na tym telefonie'); };
$('#cOk').onclick = async () => {
  cfg = { owner:$('#cO').value.trim(), repo:$('#cR').value.trim(), branch:$('#cB').value.trim()||'main',
          path:$('#cP').value.trim()||'data.json', token:$('#cT').value.trim() };
  if(!cfg.owner||!cfg.repo||!cfg.token){ toast('Uzupełnij login, repo i token'); return; }
  store('ck_cfg', cfg); sha=null; dCfg.close(); setDot('busy','Łączenie…');
  try{
    const rem = await getRemote();
    if(rem){ state = merge(state, rem.data); sha = rem.sha; store('ck_sha',sha); }
    const hasLocalOnly = !rem || Object.keys(state.hutches).some(id => !rem.data.hutches || !rem.data.hutches[id]);
    store('ck_state',state); render(); fit();
    if(hasLocalOnly && Object.keys(state.hutches).length){ dirty=true; await push(); } else setDot('ok','Połączono');
    toast('✅ Połączono z GitHub');
  } catch(e){ setDot('err',e.message); toast('⚠️ '+e.message); }
};

/* ---------- start ---------- */
// pierwsze uruchomienie: przykładowy rząd
if(!load('ck_state')){
  for(let i=0;i<4;i++){ const id=uid()+i; state.hutches[id]={id,x:60+i*(W+GAP),y:120,rot:0,l:3.5,name:'',t:1}; }
  store('ck_state',state);
}
render();
if(cfg){ setDot('busy','Łączenie…'); dirty ? push() : pull(true); } else setDot('','Brak synchronizacji – ⚙️ GitHub');
</script>
</body>
</html>
